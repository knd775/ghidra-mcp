# Production-shaped stack for this fork.
#
#   cp docker/.env.template docker/.env   # fill it
#   docker compose --env-file docker/.env -f docker/docker-compose.yml up -d
#
# Headless + bridge images come from GHCR (or `docker compose build`).
# Ghidra Server is blacktop/ghidra. RMI is published on BIND_ADDR, not
# 0.0.0.0 — the server advertises that address and clients must dial it.
#
# The bridge shares ghidra-mcp's network namespace. That is required:
# validate_server_url() only accepts loopback, so GHIDRA_MCP_URL cannot
# be http://ghidra-mcp:8089. cloudflared still reaches the bridge at
# http://ghidra-mcp:8081 because that name is the headless container.

name: ghidra

services:
  ghidra-server:
    image: blacktop/ghidra:${GHIDRA_VERSION:-12.1.2}
    container_name: ghidra-server
    command: server
    hostname: ${GHIDRA_PUBLIC_HOSTNAME:?set in .env}
    init: true
    restart: unless-stopped
    environment:
      MAXMEM: 1G
      GHIDRA_USERS: ${GHIDRA_USERS:?set in .env}
      # wrapper.app.parameter.3=-ip. External clients hang with no useful
      # error if this stays 0.0.0.0. Use the same address as BIND_ADDR.
      GHIDRA_IP: ${BIND_ADDR:?set in .env}
    volumes:
      - ghidra-repos:/repos
    ports:
      - "${BIND_ADDR:?set in .env}:13100:13100"
      - "${BIND_ADDR}:13101:13101"
      - "${BIND_ADDR}:13102:13102"
    networks:
      - ghidra

  ghidra-mcp:
    image: ghcr.io/${GHCR_OWNER:-knd775}/ghidra-mcp-headless:${GHIDRA_MCP_VERSION:-dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: missing
    container_name: ghidra-mcp
    restart: unless-stopped
    depends_on:
      ghidra-server:
        condition: service_started
      builder:
        condition: service_started
      ghidra-bsim:
        condition: service_healthy
    environment:
      GHIDRA_MCP_PORT: "8089"
      GHIDRA_MCP_BIND_ADDRESS: "0.0.0.0"
      JAVA_OPTS: "${JAVA_OPTS:--Xmx8g -XX:+UseG1GC}"

      # Must be the RMI-advertised address (BIND_ADDR), not the compose
      # service name. A name that is not on the Ghidra Server TLS SAN
      # fails as certificate_unknown and looks like a connection error.
      GHIDRA_SERVER_HOST: ${BIND_ADDR}
      GHIDRA_SERVER_PORT: "13100"

      GHIDRA_MCP_AUTH_TOKEN: ${GHIDRA_MCP_AUTH_TOKEN:?set in .env}
      GHIDRA_MCP_FILE_ROOT: /data
      # file: leftover / sidecars. Network BSim URLs use the allowlist.
      GHIDRA_MCP_BSIM_ROOT: /srv/ghidra/bsim
      GHIDRA_MCP_BSIM_URLS: "postgresql://ghidra-bsim:5432/embedded,postgresql://ghidra-bsim:5432/userland,postgresql://${BIND_ADDR}:5432/embedded,postgresql://${BIND_ADDR}:5432/userland"
      GHIDRA_MCP_BSIM_USER: ${BSIM_DB_USER:-bsim}
      GHIDRA_MCP_BSIM_PASSWORD: ${BSIM_DB_PASSWORD:?set in .env}
      GHIDRA_MCP_BSIM_TEMPLATES: "embedded:medium_nosize,userland:medium_nosize"
      # One builder, every identity. No docker.sock, no host ports.
      GHIDRA_MCP_BUILDER_URL: "http://ghidra-builder:8092"
      # Stub listing for mode=framework dry_run (builder image also bakes these in).
      GHIDRA_MCP_STUBS: /opt/ghidra-builder/stubs

      # -Duser.name. Must match the Ghidra Server account.
      GHIDRA_USER: ${GHIDRA_SERVER_USER:?set in .env}
      GHIDRA_SERVER_USER: ${GHIDRA_SERVER_USER}
      GHIDRA_SERVER_PASSWORD: ${GHIDRA_SERVER_PASSWORD:?set in .env}

      # Executes Java inside the Ghidra process. Off unless you set 1.
      GHIDRA_MCP_ALLOW_SCRIPTS: ${GHIDRA_MCP_ALLOW_SCRIPTS:-}
    volumes:
      # Absolute host path. Relative paths are unreliable in Portainer.
      - ${SAMPLES_DIR:?set in .env to an absolute host path}:/data
      - ./references.yaml:/data/references.yaml:ro
      - ./references.userland.yaml:/data/references.userland.yaml:ro
      - ./stubs:/opt/ghidra-builder/stubs:ro
      - ghidra-mcp-home:/home/ghidra
      - ghidra-mcp-projects:/projects
      - ghidra-bsim:/srv/ghidra/bsim
    ports:
      # Loopback only. Remote MCP goes through cloudflared, not these.
      - "127.0.0.1:8089:8089"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - ghidra
      - ghidra-db

  # PostgreSQL for BSim. Not on the tunnel network: cloudflared cannot
  # reach it. Published on BIND_ADDR:5432 like Ghidra Server RMI, so GUI
  # clients on the VPN/LAN can use Find Similar Functions against the
  # same databases the MCP tools query. A stock postgres image will not
  # work — BSim needs the lshvector C extension (this image). SSL is on;
  # Ghidra refuses a non-SSL connection.
  ghidra-bsim:
    image: ghcr.io/${GHCR_OWNER:-knd775}/ghidra-mcp-bsim:${GHIDRA_MCP_VERSION:-dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile.bsim
    pull_policy: missing
    container_name: ghidra-bsim
    hostname: ghidra-bsim
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BSIM_DB_USER:-bsim}
      POSTGRES_PASSWORD: ${BSIM_DB_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
    volumes:
      - ghidra-bsim-pgdata:/var/lib/postgresql/data
      - ghidra-bsim-certs:/var/lib/postgresql/certs
    ports:
      - "${BIND_ADDR:?set in .env}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - ghidra-db

  # pg_dump both BSim databases on a schedule, and tar ghidra-repos when
  # that volume is mounted. Same image as ghidra-bsim (has pg_dump + SSL).
  bsim-backup:
    image: ghcr.io/${GHCR_OWNER:-knd775}/ghidra-mcp-bsim:${GHIDRA_MCP_VERSION:-dev}
    pull_policy: missing
    container_name: ghidra-bsim-backup
    restart: unless-stopped
    depends_on:
      ghidra-bsim:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/bsim-backup.sh"]
    environment:
      PGHOST: ghidra-bsim
      PGUSER: ${BSIM_DB_USER:-bsim}
      PGPASSWORD: ${BSIM_DB_PASSWORD:?set in .env}
      PGSSLMODE: require
      BACKUP_KEEP_DAYS: ${BSIM_BACKUP_KEEP_DAYS:-14}
    volumes:
      - bsim-backups:/backups
      - ghidra-repos:/repos:ro
    networks:
      - ghidra-db

  # No networks: or ports: here — it inherits ghidra-mcp's. Anything that
  # can reach 8081 on that namespace can also reach 8089.
  ghidra-mcp-bridge:
    image: ghcr.io/${GHCR_OWNER:-knd775}/ghidra-mcp-bridge:${GHIDRA_MCP_VERSION:-dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    pull_policy: missing
    container_name: ghidra-mcp-bridge
    restart: unless-stopped
    depends_on:
      ghidra-mcp:
        condition: service_healthy
    network_mode: "service:ghidra-mcp"
    command:
      - --transport
      - streamable-http
      - --mcp-host
      - "0.0.0.0"
      - --mcp-port
      - "8081"
    environment:
      GHIDRA_MCP_URL: http://127.0.0.1:8089
      GHIDRA_MCP_AUTH_TOKEN: ${GHIDRA_MCP_AUTH_TOKEN:?set in .env}
      GHIDRA_MCP_REQUIRE_PROGRAM_SELECTORS: "1"
      GHIDRA_MCP_MAX_CONCURRENT_REQUESTS: ${GHIDRA_MCP_MAX_CONCURRENT_REQUESTS:-4}
      # Must include the tunnel hostname or forwarded Host headers are rejected.
      GHIDRA_MCP_ALLOWED_HOSTS: ${GHIDRA_MCP_ALLOWED_HOSTS:?set in .env}

  # One resident builder, pulled from GHCR as ghidra-mcp-builder (same
  # owner/tag as headless and bridge). Holds gcc10-arm, gcc12-arm,
  # gcc13-arm, and gcc13-x86_64 (distro gcc-13, no 32-bit multilib).
  # Compose DNS name stays ghidra-builder. ghidra-mcp POSTs jobs on the
  # compose network (not docker exec: that would require docker.sock in
  # the process that parses untrusted binaries).
  # No host ports, no tunnel, no auth beyond the internal network.
  builder:
    image: ghcr.io/${GHCR_OWNER:-knd775}/ghidra-mcp-builder:${GHIDRA_MCP_VERSION:-dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile.builder
    pull_policy: missing
    container_name: ghidra-builder
    hostname: ghidra-builder
    restart: unless-stopped
    user: "1000:1000"
    environment:
      BUILDER_PORT: "8092"
      GHIDRA_MCP_FILE_ROOT: /data
      GHIDRA_MCP_STUBS: /opt/ghidra-builder/stubs
      GHIDRA_MCP_TOOLCHAINS: /opt/ghidra-builder/toolchains
    volumes:
      - ${SAMPLES_DIR:?set in .env to an absolute host path}:/data
      - builder-src-cache:/src
    networks:
      - ghidra

  # Dashboard tunnel: HTTP origin http://ghidra-mcp:8081 (bridge shares
  # that namespace). Register https://<hostname>/mcp in Zero Trust AI
  # controls and put an Access policy on the origin. The tunnel does not
  # authenticate; leave Access Managed OAuth off (the bridge ignores the JWT).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ghidra-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
      - ghidra-mcp
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    networks:
      - ghidra

volumes:
  ghidra-repos:
  ghidra-mcp-home:
  ghidra-mcp-projects:
  ghidra-bsim:
  ghidra-bsim-pgdata:
  ghidra-bsim-certs:
  bsim-backups:
  builder-src-cache:

networks:
  ghidra:
    driver: bridge
  # BSim Postgres. ghidra-mcp joins this; cloudflared does not.
  ghidra-db:
    driver: bridge
