# BSim PostgreSQL: SSL is mandatory on TCP. Unix sockets stay local to
# this container (healthcheck, init). Ghidra's client hard-codes
# sslmode=require; a hostnossl line that is not reject looks like SSL is
# optional when it is not.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             ::1/128                 scram-sha-256
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
