# GUI / MCP BSim access (PostgreSQL, not Ghidra Server)
#
#   URL (VPN/LAN):  postgresql://<BIND_ADDR>:5432/bsim
#   URL (compose):  postgresql://ghidra-bsim:5432/bsim
#   Template:       medium_nosize — every database, unconditionally.
#                   medium_nosize beat medium_32 under compiler and
#                   optimisation drift and gave up nothing on identical
#                   builds. ARM firmware and x86-64 userland share this
#                   database so cross-arch matches are queryable. Use
#                   bsim_query(arch=...) to constrain.
#   Login:          BSIM_DB_USER / BSIM_DB_PASSWORD in docker/.env
#                   These are not the Ghidra Server account.
#
# The database is derived from the manifests and should be rebuildable
# from scratch: build_manifest → import_file → bsim_ingest. Do not
# convert H2 files; re-ingest the artifacts already on /data.

database: postgresql://ghidra-bsim:5432/bsim
config_template: medium_nosize

# One entry expands through its matrix. littlefs × {gcc10-arm,gcc12-arm,
# gcc13-arm} × {-Os,-O2,-O3} is nine objects; that is the drift that made a
# single GCC 13 object match the right functions at 0.27–0.35 similarity.
# Version barely moved lfs_dir_fetchmatch (1040–1120 bytes across
# v2.4.2–v2.9.3); compiler version did. Family drift (Clang vs GCC) is larger
# still — add clangN-arm as an axis when that image exists, not a new tool.
#
# Names land on disk as <name>-<ref>-<toolchain>-<opt>.o so bsim_list_corpus
# can still be read in six months. toolchain is <compiler><major>-<target>.
# Framework entries add -<library>[-<board>]. Pin tags or SHAs, never branches.
#
# Compiled with -g. DWARF paths are rewritten to /ref/<name>/... so one
# Ghidra Source Files transform covers the corpus: /ref/ -> <local checkout>/.
# strip_debug defaults to false; set it only if corpus disk is the constraint.
# Sidecars record debug_path_prefix.
#
# Each littlefs configuration × 3 toolchains × 3 opt = 9, for 18 littlefs
# objects total. pico-sdk × 3 toolchains × 2 opt × 2 boards = 12.
# frotz × gcc13-arm × {-O2, -Os} = 2. build_manifest skips a job only
# when the output exists, its sidecar is readable, the artifact SHA-256
# matches, and the recorded prepare command matches.
# x86-64 userland lives in docker/references.userland.yaml (same
# database, different build matrix).

references:
  - name: littlefs
    repo: https://github.com/littlefs-project/littlefs.git
    ref: v2.9.3
    sources: [lfs.c]
    defines: [LFS_NO_MALLOC, LFS_NO_ASSERT]
    arch_flags: "-mcpu=cortex-m0plus -mthumb"
    matrix:
      toolchain: [gcc10-arm, gcc12-arm, gcc13-arm]
      opt: [-Os, -O2, -O3]

  # Keep the no-assert build above because deployed firmware uses both
  # configurations. This second identity retains LFS_ERROR strings and
  # assertions so corroboration can compare the strongest source-level
  # evidence instead of constants alone.
  - name: littlefs-logging
    repo: https://github.com/littlefs-project/littlefs.git
    ref: v2.9.3
    sources: [lfs.c]
    defines: [LFS_NO_MALLOC]
    arch_flags: "-mcpu=cortex-m0plus -mthumb"
    matrix:
      toolchain: [gcc10-arm, gcc12-arm, gcc13-arm]
      opt: [-Os, -O2, -O3]

  - name: pico-sdk
    mode: framework
    framework: pico-sdk
    repo: https://github.com/raspberrypi/pico-sdk.git
    ref: 2.1.0
    libraries:
      - pico_stdlib
      - hardware_i2c
      - hardware_spi
      - hardware_pio
      - hardware_flash
      - hardware_dma
      - hardware_uart
      - hardware_gpio
      - hardware_timer
      - pico_multicore
      - pico_unique_id
    matrix:
      toolchain: [gcc10-arm, gcc12-arm, gcc13-arm]
      opt: [-Os, -O2]
      board: [pico, pico_w]

  # Interpreter core only. defs.h and hash.h are Makefile-generated, not
  # committed — that is a missing build step, not a missing project model,
  # so this stays mode=sources with prepare rather than a framework stub.
  # Skip src/curses/ and src/sdl/; they are not present on an embedded
  # target. Hosted-POSIX units that fail to cross-compile are named and
  # skipped; the core (interpret / load_operand / store / branch) is the
  # ground truth already identified in firmware. -O2 first: littlefs on
  # the same class of firmware matched -O2 at 0.92–1.00 vs -Os at 0.27–0.35.
  - name: frotz
    repo: https://gitlab.com/DavidGriffith/frotz.git
    ref: "2.54"
    prepare: make src/common/defs.h src/common/hash.h
    # frotz.h does `typedef int bool`. gnu11 is the dialect this
    # release was written for; GCC 15's default C23 rejects it.
    extra_flags: [-std=gnu11]
    sources:
      - src/common/process.c
      - src/common/object.c
      - src/common/text.c
      - src/common/math.c
      - src/common/variable.c
      - src/common/table.c
      - src/common/buffer.c
      - src/common/redirect.c
      - src/common/stream.c
    matrix:
      toolchain: [gcc13-arm]
      opt: [-O2, -Os]
