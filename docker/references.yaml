# GUI / MCP BSim access (PostgreSQL, not Ghidra Server)
#
#   URL (VPN/LAN):  postgresql://<BIND_ADDR>:5432/embedded
#   URL (compose):  postgresql://ghidra-bsim:5432/embedded
#   Template:       medium_nosize — every database, unconditionally.
#                   medium_nosize beat medium_32 under compiler and
#                   optimisation drift and gave up nothing on identical
#                   builds. Mixing ARM with x86-64 in one database is
#                   harmless; keep this file ARM because native x86-64
#                   references cannot substitute for ARM ones. Use
#                   bsim_query(arch=...) to constrain.
#   Login:          BSIM_DB_USER / BSIM_DB_PASSWORD in docker/.env
#                   These are not the Ghidra Server account.
#
# The database is derived from this file and should be rebuildable from
# scratch: build_manifest → import_file → bsim_ingest. Do not convert H2
# files; re-ingest the artifacts already on /data.

database: postgresql://ghidra-bsim:5432/embedded
config_template: medium_nosize

# One entry expands through its matrix. littlefs × {gcc10-arm,gcc12-arm,
# gcc13-arm} × {-Os,-O2,-O3} is nine objects; that is the drift that made a
# single GCC 13 object match the right functions at 0.27–0.35 similarity.
# Version barely moved lfs_dir_fetchmatch (1040–1120 bytes across
# v2.4.2–v2.9.3); compiler version did. Family drift (Clang vs GCC) is larger
# still — add clangN-arm as an axis when that image exists, not a new tool.
#
# Names land on disk as <name>-<ref>-<toolchain>-<opt>.o so bsim_list_corpus
# can still be read in six months. toolchain is <compiler><major>-<target>.
# Framework entries add -<library>[-<board>]. Pin tags or SHAs, never branches.
#
# Compiled with -g. DWARF paths are rewritten to /ref/<name>/... so one
# Ghidra Source Files transform covers the corpus: /ref/ -> <local checkout>/.
# strip_debug defaults to false; set it only if corpus disk is the constraint.
# Sidecars record debug_path_prefix.
#
# littlefs × 3 toolchains × 3 opt = 9. pico-sdk × 3 toolchains × 2 opt ×
# 2 boards = 12. build_manifest skips jobs whose outputs already exist.
# x86-64 userland lives in docker/references.userland.yaml (also medium_nosize;
# the split is corpus domain, not pointer size).

references:
  - name: littlefs
    repo: https://github.com/littlefs-project/littlefs.git
    ref: v2.9.3
    sources: [lfs.c]
    defines: [LFS_NO_MALLOC, LFS_NO_ASSERT]
    arch_flags: "-mcpu=cortex-m0plus -mthumb"
    matrix:
      toolchain: [gcc10-arm, gcc12-arm, gcc13-arm]
      opt: [-Os, -O2, -O3]

  - name: pico-sdk
    mode: framework
    framework: pico-sdk
    repo: https://github.com/raspberrypi/pico-sdk.git
    ref: 2.1.0
    libraries:
      - pico_stdlib
      - hardware_i2c
      - hardware_spi
      - hardware_pio
      - hardware_flash
      - hardware_dma
      - pico_multicore
    matrix:
      toolchain: [gcc10-arm, gcc12-arm, gcc13-arm]
      opt: [-Os, -O2]
      board: [pico, pico_w]
