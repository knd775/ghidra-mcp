name: Publish images to GHCR

on:
  push:
    branches: [ main, dev, develop ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# OSSF Scorecard Token-Permissions: default to read-only. Jobs that push
# elevate packages/attestations at the job level.
permissions:
  contents: read

# Do not cancel at the workflow level. A docs-only push would start this
# workflow, skip every image job, and kill an in-progress builder that
# is actually changing. Each image job has its own concurrency group.
env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect which images would change
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.detect.outputs.bridge }}
      headless: ${{ steps.detect.outputs.headless }}
      builder: ${{ steps.detect.outputs.builder }}
      bsim: ${{ steps.detect.outputs.bsim }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - id: detect
      name: Compare this push against each image's COPY inputs
      run: |
        set -euo pipefail
        out() { python3 -m tools.docker_image_changes "$@" >> "$GITHUB_OUTPUT"; }

        # Tags and a human dispatch always publish. A missing before SHA
        # is a new branch (or a fetch we cannot do) and is fail-closed.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
           || [ "${{ github.ref_type }}" = "tag" ]; then
          out --all
          exit 0
        fi

        before="${{ github.event.before }}"

        if [ -z "${before}" ] \
           || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
          out --all
          exit 0
        fi

        if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
          if ! git fetch --depth=1 origin "${before}"; then
            echo "could not fetch ${before}; building every image" >&2
            out --all
            exit 0
          fi
        fi

        git diff --name-only "${before}" HEAD | out

  bridge:
    name: Bridge image
    needs: [changes]
    if: needs.changes.outputs.bridge == 'true'
    concurrency:
      group: ghcr-bridge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set image name
      run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ghidra-mcp-bridge" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/Dockerfile.bridge
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=bridge
        cache-to: type=gha,mode=max,scope=bridge

  headless:
    name: Headless image
    # Downloads Ghidra. Skip pushes that do not touch a file this image COPYs.
    needs: [changes]
    if: needs.changes.outputs.headless == 'true'
    concurrency:
      group: ghcr-headless-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set image name
      run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ghidra-mcp-headless" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=headless
        cache-to: type=gha,mode=max,scope=headless

  builder:
    name: Builder image
    # Fetches pinned ARM GNU tarballs from developer.arm.com. Same rule as
    # headless: build when the image would change.
    needs: [changes]
    if: needs.changes.outputs.builder == 'true'
    concurrency:
      group: ghcr-builder-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set image name
      run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ghidra-mcp-builder" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/Dockerfile.builder
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=builder
        cache-to: type=gha,mode=max,scope=builder

  bsim:
    name: BSim PostgreSQL image
    # Sparse-clones Ghidra for lshvector. Same rule as headless/builder:
    # build when the image would change.
    needs: [changes]
    if: needs.changes.outputs.bsim == 'true'
    concurrency:
      group: ghcr-bsim-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set image name
      run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ghidra-mcp-bsim" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        context: .
        file: docker/Dockerfile.bsim
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=bsim
        cache-to: type=gha,mode=max,scope=bsim
